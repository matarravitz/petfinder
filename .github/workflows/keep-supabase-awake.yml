name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */3 * *' # every 3 days at 06:00 UTC — well under Supabase's 7-day free-tier pause window
  workflow_dispatch: {} # allows a manual run from the Actions tab to test the secret/URL

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the production database to register activity
        run: |
          curl -sf "https://ulfathyhapwphaqtujjr.supabase.co/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
